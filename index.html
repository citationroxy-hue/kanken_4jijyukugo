]);

// 級 → 難易度ティアの対応
const LEVEL_TIER = {
  "1級": "advanced", "準1級": "advanced", "2級": "advanced",
  "準2級": "intermediate", "3級": "intermediate", "4級": "intermediate",
  "5級": "beginner"
};

const TIERS = [
  { key: "advanced",     label: "上級", sub: "1級・準1級・2級" },
  { key: "intermediate", label: "中級", sub: "準2級・3級・4級" },
  { key: "beginner",     label: "初級", sub: "5級" },
  { key: "daily",        label: "日常", sub: "級を問わず頻出語" }
];

const HINT_MODES = [
  { key: "none",    label: "ヒントなし" },
  { key: "reading", label: "読み方だけ" },
  { key: "meaning", label: "意味" },
  { key: "origin",  label: "由来だけ" },
  { key: "both",    label: "読みと意味の両方" }
];

/* ========================================================================
   CSV読み込み・パース
   ======================================================================== */

function parseCSV(text){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

// 「意味・由来」が1つの文章にまとまっているため、最初の句点までを意味、
// それ以降を由来(語源の説明)とみなして分割する
function splitMeaning(text){
  const idx = text.indexOf('。');
  if(idx === -1) return { meaning: text, origin: '' };
  return { meaning: text.slice(0, idx+1), origin: text.slice(idx+1).trim() };
}

let ALL_IDIOMS = [];

function buildIdioms(csvText){
  const rows = parseCSV(csvText.replace(/^\uFEFF/, ''));
  const body = rows.slice(1).filter(r => r.length >= 4 && r[1]);
  ALL_IDIOMS = body.map(r=>{
    const level = r[0].trim();
    const kanji = r[1].trim();
    const reading = r[2].trim();
    const { meaning, origin } = splitMeaning((r[3] || '').trim());
    return {
      level, kanji, reading, meaning, origin,
      fullText: (r[3] || '').trim(),
      tier: LEVEL_TIER[level] || null,
      isDaily: DAILY_SET.has(kanji)
    };
  });
}

function poolForTier(tierKey){
  if(tierKey === 'daily') return ALL_IDIOMS.filter(w => w.isDaily);
  return ALL_IDIOMS.filter(w => w.tier === tierKey);
}

/* ========================================================================
   状態管理
   ======================================================================== */

let state = {
  screen: 'loading',
  tier: 'beginner',
  mode: 'count',
  targetCount: 10,
  timeLimit: 60,
  hintMode: 'none',
  hintUsedCount: 0,
  timeRemaining: 0,
  timerId: null,
  pool: [],
  current: null,
  checked: false,
  correctCount: 0,
  totalCount: 0,
  history: [],
  mypageTab: 'sessions',
  progress: { sessions: [], wordStats: {} },
  student: { department: DEPARTMENTS[0], number: 1, name: '' },
  loadError: null
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---- ローカル保存(進捗・生徒情報は端末ごとに保存) ---- */

function loadProgress(){
  try{
    const raw = localStorage.getItem('yjj_progress');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        state.progress.sessions = Array.isArray(parsed.sessions) ? parsed.sessions : [];
        state.progress.wordStats = (parsed.wordStats && typeof parsed.wordStats === 'object') ? parsed.wordStats : {};
      }
    }
  } catch(err){ /* 初回利用時などはデフォルトのまま */ }
}

function saveProgress(){
  try{ localStorage.setItem('yjj_progress', JSON.stringify(state.progress)); }
  catch(err){ console.error('進捗の保存に失敗しました', err); }
}

function loadStudent(){
  try{
    const raw = localStorage.getItem('yjj_student');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        if(DEPARTMENTS.includes(parsed.department)) state.student.department = parsed.department;
        if(ATTENDANCE_NUMBERS.includes(parsed.number)) state.student.number = parsed.number;
        if(typeof parsed.name === 'string') state.student.name = parsed.name;
      }
    }
  } catch(err){ /* 初回利用時などはデフォルトのまま */ }
}

function saveStudent(){
  try{ localStorage.setItem('yjj_student', JSON.stringify(state.student)); }
  catch(err){ console.error('生徒情報の保存に失敗しました', err); }
}

/* ---- 先生への自動送信(Googleフォーム) ---- */
/* オンラインなら即送信、失敗・オフライン時はキューに貯めて後で自動送信 */

function loadQueue(){
  try{
    const raw = localStorage.getItem('yjj_pending_queue');
    return raw ? JSON.parse(raw) : [];
  } catch(err){ return []; }
}

function saveQueue(queue){
  try{ localStorage.setItem('yjj_pending_queue', JSON.stringify(queue)); }
  catch(err){ console.error('送信待ちデータの保存に失敗しました', err); }
}

function queueForLater(url, paramsObj){
  const queue = loadQueue();
  queue.push({ url, params: paramsObj, queuedAt: new Date().toISOString() });
  saveQueue(queue);
}

function flushPendingQueue(){
  if(!navigator.onLine) return;
  const queue = loadQueue();
  if(!queue.length) return;

  const remaining = [];
  const tasks = queue.map(item=>
    fetch(item.url, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(item.params) })
      .catch(()=>{ remaining.push(item); })
  );
  Promise.all(tasks).then(()=>{ saveQueue(remaining); });
}

window.addEventListener('online', flushPendingQueue);

function buildFormParams(session){
  const e = GOOGLE_FORM_CONFIG.entries;
  const tierLabel = (TIERS.find(t=>t.key===state.tier) || {}).label || '';
  const modeStr = (session.mode === 'count' ? `出題数${session.setting}問` : `タイム${session.setting}秒`);
  const params = {};
  if(e.department) params[e.department] = state.student.department;
  if(e.number) params[e.number] = String(state.student.number);
  if(e.name) params[e.name] = state.student.name;
  if(e.mode) params[e.mode] = `${tierLabel}・${modeStr}`;
  if(e.correct) params[e.correct] = String(session.correct);
  if(e.total) params[e.total] = String(session.total);
  if(e.accuracy) params[e.accuracy] = String(session.accuracy);
  if(e.hintCount) params[e.hintCount] = String(session.hintCount);
  return params;
}

function sendResultToTeacher(session){
  if(!GOOGLE_FORM_CONFIG.url) return;
  const params = buildFormParams(session);

  if(!navigator.onLine){
    queueForLater(GOOGLE_FORM_CONFIG.url, params);
    return;
  }
  fetch(GOOGLE_FORM_CONFIG.url, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(params) })
    .catch(()=>{ queueForLater(GOOGLE_FORM_CONFIG.url, params); });
}

function recordSession(){
  const rate = state.totalCount ? Math.round((state.correctCount/state.totalCount)*100) : 0;
  const session = {
    date: new Date().toISOString(),
    tier: state.tier,
    mode: state.mode,
    correct: state.correctCount,
    total: state.totalCount,
    accuracy: rate,
    hintCount: state.hintUsedCount,
    setting: state.mode === 'count' ? state.targetCount : state.timeLimit
  };
  state.progress.sessions.push(session);
  if(state.progress.sessions.length > 50){
    state.progress.sessions = state.progress.sessions.slice(-50);
  }
  state.history.forEach(h=>{
    const ws = state.progress.wordStats[h.kanji] || { correct:0, wrong:0, pass:0 };
    if(h.result === 'correct') ws.correct += 1;
    else if(h.result === 'wrong') ws.wrong += 1;
    else ws.pass += 1;
    state.progress.wordStats[h.kanji] = ws;
  });
  saveProgress();
  sendResultToTeacher(session);
}

/* ========================================================================
   ゲームロジック
   ======================================================================== */

function startGame(){
  state.targetCount = Math.max(1, parseInt(state.targetCount,10) || 10);
  state.timeLimit = Math.max(1, parseInt(state.timeLimit,10) || 60);
  state.student.name = (state.student.name || '').trim();
  saveStudent();

  state.correctCount = 0;
  state.totalCount = 0;
  state.hintUsedCount = 0;
  state.history = [];
  state.pool = shuffle(poolForTier(state.tier));
  state.screen = 'play';

  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }

  if(state.mode === 'time'){
    state.timeRemaining = state.timeLimit;
    state.timerId = setInterval(()=>{
      state.timeRemaining -= 1;
      const disp = document.getElementById('timer-display');
      if(disp) disp.textContent = state.timeRemaining;
      if(state.timeRemaining <= 0){
        clearInterval(state.timerId);
        state.timerId = null;
        endGame();
      }
    }, 1000);
  }

  nextQuestion();
}

function nextQuestion(){
  if(state.pool.length === 0){
    state.pool = shuffle(poolForTier(state.tier));
  }
  const idiom = state.pool.pop();
  const numBlanks = Math.random() < 0.5 ? 1 : 2;
  const positions = shuffle([0,1,2,3]).slice(0, numBlanks).sort((a,b)=>a-b);
  state.current = { idiom, blanks: positions, hintShown:false, results:null, result:null };
  state.checked = false;
  render();
}

function checkAnswer(){
  const { idiom, blanks } = state.current;
  const chars = idiom.kanji.split('');
  const results = {};
  let allCorrect = true;
  blanks.forEach(idx=>{
    const inp = document.getElementById('blank-'+idx);
    const val = (inp && inp.value ? inp.value : '').trim();
    const expected = chars[idx];
    const ok = val === expected;
    if(!ok) allCorrect = false;
    results[idx] = { value: val, expected, ok };
  });
  state.current.results = results;
  state.current.result = allCorrect ? 'correct' : 'wrong';
  state.correctCount += allCorrect ? 1 : 0;
  state.totalCount += 1;
  state.history.push({ kanji: idiom.kanji, reading: idiom.reading, meaning: idiom.fullText, result: state.current.result });
  state.checked = true;
  render();
}

function passQuestion(){
  const { idiom } = state.current;
  state.totalCount += 1;
  state.history.push({ kanji: idiom.kanji, reading: idiom.reading, meaning: idiom.fullText, result: 'pass' });
  advanceOrEnd();
}

function advance(){ advanceOrEnd(); }

function advanceOrEnd(){
  if(state.mode === 'count' && state.totalCount >= state.targetCount){
    endGame();
  } else {
    nextQuestion();
  }
}

function endGame(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  recordSession();
  state.screen = 'result';
  render();
}

function restart(){
  state.screen = 'start';
  render();
}

document.addEventListener('keydown', (e)=>{
  if(state.screen === 'play' && state.checked && e.key === 'Enter'){
    e.preventDefault();
    advance();
  }
});

/* ========================================================================
   画面描画
   ======================================================================== */

function renderLoading(){
  return `<div class="tanzaku"><p class="lead" style="margin:0;">読み込み中…</p></div>`;
}

function renderError(){
  return `
    <div class="tanzaku">
      <h1 class="title" style="font-size:1.2rem;">読み込みエラー</h1>
      <p class="error-text">
        四字熟語のデータ(<code>${CSV_FILE}</code>)を読み込めませんでした。<br><br>
        このHTMLファイルと <code>kanken_yojijukugo.csv</code> を<strong>同じフォルダ</strong>に置いた状態で公開・閲覧してください。ファイルをそのままダブルクリックして開いた場合(file://で開いた場合)もこのエラーになることがあります。GitHub Pagesなど、Webサーバー経由で開くと解決します。
      </p>
      <button id="retry-btn" class="primary-btn">再読み込み</button>
    </div>
  `;
}

function renderStart(){
  const numLabel = state.mode === 'count' ? '出題数' : '制限時間（秒）';
  const numValue = state.mode === 'count' ? state.targetCount : state.timeLimit;

  const deptOptions = DEPARTMENTS.map(d=>`<option value="${d}" ${state.student.department===d?'selected':''}>${d}</option>`).join('');
  const numberOptions = ATTENDANCE_NUMBERS.map(n=>`<option value="${n}" ${state.student.number===n?'selected':''}>${n}</option>`).join('');
  const tierButtons = TIERS.map(t=>`
    <button type="button" class="tier-btn ${state.tier===t.key?'active':''}" data-tier="${t.key}">
      ${t.label}<span class="tier-sub">${t.sub}</span>
    </button>
  `).join('');
  const hintOptions = HINT_MODES.map(h=>`<option value="${h.key}" ${state.hintMode===h.key?'selected':''}>${h.label}</option>`).join('');

  return `
    <div class="tanzaku">
      <h1 class="title">四字熟語タイピング</h1>
      <p class="lead">空欄になった漢字を、読みから変換して埋めてください。</p>

      <div class="section-label">生徒情報</div>
      <div class="field-group two-col">
        <div>
          <label class="field-label" for="dept-select">学科</label>
          <select id="dept-select" class="select-field">${deptOptions}</select>
        </div>
        <div>
          <label class="field-label" for="number-select">出席番号</label>
          <select id="number-select" class="select-field">${numberOptions}</select>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" for="name-input">氏名</label>
        <input type="text" id="name-input" class="text-input" placeholder="例：北海太郎" value="${state.student.name}">
      </div>

      <div class="section-label" style="margin-top:32px;">プレイ設定</div>
      <div class="field-group">
        <span class="field-label">難易度</span>
        <div class="tier-grid" id="tier-grid">${tierButtons}</div>
      </div>

      <div class="field-group">
        <span class="field-label">出題モード</span>
        <div class="segmented" id="mode-segmented">
          <button type="button" class="seg-btn ${state.mode==='count'?'active':''}" data-mode="count">出題数モード</button>
          <button type="button" class="seg-btn ${state.mode==='time'?'active':''}" data-mode="time">タイムアタック</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="num-input">${numLabel}</label>
        <input type="number" min="1" step="1" id="num-input" class="num-input" value="${numValue}">
      </div>

      <div class="field-group">
        <label class="field-label" for="hint-select">ヒント</label>
        <select id="hint-select" class="select-field">${hintOptions}</select>
      </div>

      <button id="start-btn" class="primary-btn">はじめる</button>
      <button id="mypage-btn-start" class="ghost-btn" style="width:100%; margin-top:12px;">マイページ（記録を見る）</button>
    </div>
  `;
}

function hintContent(current){
  const { idiom, hintShown } = current;
  if(!hintShown) return '';
  if(state.hintMode === 'reading') return idiom.reading;
  if(state.hintMode === 'meaning') return idiom.meaning || '(意味の記載がありません)';
  if(state.hintMode === 'origin') return idiom.origin || '(由来の記載はありません)';
  if(state.hintMode === 'both') return `${idiom.reading}／${idiom.meaning || '(意味の記載がありません)'}`;
  return '';
}

function renderPlay(){
  const { idiom, blanks, hintShown } = state.current;
  const chars = idiom.kanji.split('');
  const tierLabel = (TIERS.find(t=>t.key===state.tier) || {}).label || '';

  const cellsHtml = chars.map((ch, i)=>{
    if(blanks.includes(i)){
      if(state.checked){
        const r = state.current.results[i];
        return `<div class="cell blank-result ${r.ok?'correct':'wrong'}">${r.expected}</div>`;
      }
      return `<input class="cell blank-input" id="blank-${i}" data-index="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ja">`;
    }
    return `<div class="cell filled">${ch}</div>`;
  }).join('');

  const statusLeft = state.mode === 'count'
    ? `${Math.min(state.totalCount+1, state.targetCount)} / ${state.targetCount}問`
    : `残り <span id="timer-display">${state.timeRemaining}</span>秒`;

  const hintEnabled = state.hintMode !== 'none';
  const hintBtnHtml = hintEnabled
    ? `<button id="hint-btn" class="ghost-btn" ${hintShown ? 'disabled' : ''}>ヒント</button>`
    : '';

  const feedbackHtml = state.checked
    ? `<div class="feedback ${state.current.result==='correct'?'ok':'ng'}">${state.current.result==='correct' ? '正解' : '不正解 － 正しい漢字を表示しました'}（Enterで次へ）</div>`
    : `<div class="feedback"></div>`;

  return `
    <div class="tanzaku">
      <div class="status-row">
        <span class="status-item">${statusLeft}</span>
        <span class="status-item stamp">正解 ${state.correctCount}</span>
      </div>
      <div class="tier-tag">${tierLabel}</div>

      <div class="cells">${cellsHtml}</div>

      <div class="reading-hint">${hintContent(state.current)}</div>

      <div class="action-row">
        ${hintBtnHtml}
        <button id="pass-btn" class="ghost-btn" ${state.checked?'disabled':''}>パス</button>
        <button id="check-btn" class="primary-btn" style="width:auto; padding:11px 24px;">${state.checked ? '次へ' : '決定'}</button>
      </div>

      ${feedbackHtml}
    </div>
  `;
}

function renderResult(){
  const rate = state.totalCount ? Math.round((state.correctCount/state.totalCount)*100) : 0;
  const tierLabel = (TIERS.find(t=>t.key===state.tier) || {}).label || '';
  const modeNote = state.mode === 'time' ? `　（制限時間 ${state.timeLimit}秒）` : '';

  const itemsHtml = state.history.map(h=>{
    const mark = h.result === 'correct' ? '○' : (h.result === 'wrong' ? '✕' : '－');
    return `
      <li class="history-item">
        <div class="history-row1">
          <span class="h-mark ${h.result}">${mark}</span>
          <span class="h-kanji">${h.kanji}</span>
          <span class="h-reading">${h.reading}</span>
        </div>
        <div class="h-meaning">${h.meaning}</div>
      </li>
    `;
  }).join('');

  return `
    <div class="tanzaku">
      <div class="score-stamp">${state.correctCount} / ${state.totalCount}</div>
      <p class="result-sub">${tierLabel}　正答率 ${rate}%${modeNote}</p>

      <ul class="history-list">${itemsHtml}</ul>

      <div class="action-row" style="margin-bottom:0;">
        <button id="restart-btn" class="primary-btn" style="flex:1;">もう一度</button>
        <button id="mypage-btn-result" class="ghost-btn" style="flex:1;">マイページ</button>
      </div>
    </div>
  `;
}

function buildSparkline(sessions){
  if(!sessions.length) return '';
  const w = 300, h = 60, pad = 6;
  const pts = sessions.map((s,i)=>{
    const x = sessions.length === 1 ? w/2 : pad + (i*(w-2*pad))/(sessions.length-1);
    const y = h - pad - ((s.accuracy/100)*(h-2*pad));
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `
    <div class="sparkline-wrap">
      <svg viewBox="0 0 ${w} ${h}" class="sparkline" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="#9C2B23" stroke-width="2"/>
      </svg>
      <div class="sparkline-label">直近${sessions.length}回の正答率推移</div>
    </div>
  `;
}

function renderMypage(){
  const sessions = state.progress.sessions.slice().reverse();

  const wordEntries = Object.keys(state.progress.wordStats).map(k=>{
    const ws = state.progress.wordStats[k];
    const attempts = ws.correct + ws.wrong;
    return { kanji:k, ...ws, accuracy: attempts ? Math.round((ws.correct/attempts)*100) : null };
  });
  wordEntries.sort((a,b)=>{
    const aa = a.accuracy === null ? 101 : a.accuracy;
    const bb = b.accuracy === null ? 101 : b.accuracy;
    return aa - bb;
  });

  const sessionsHtml = sessions.length ? sessions.map(s=>{
    const d = new Date(s.date);
    const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const tierLabel = (TIERS.find(t=>t.key===s.tier) || {}).label || '';
    const modeStr = s.mode === 'count' ? `出題数${s.setting}問` : `タイム${s.setting}秒`;
    return `<li class="session-row">
      <span class="session-date">${dateStr}</span>
      <span class="session-mode">${tierLabel}・${modeStr}</span>
      <span class="session-score">${s.correct}/${s.total}（${s.accuracy}%）</span>
    </li>`;
  }).join('') : `<li class="empty-note">まだプレイ記録がありません。</li>`;

  const wordsHtml = wordEntries.length ? wordEntries.map(w=>{
    const accStr = w.accuracy === null ? '－' : `${w.accuracy}%`;
    return `<li class="word-row">
      <span class="word-kanji">${w.kanji}</span>
      <span class="word-detail">正解${w.correct}・誤答${w.wrong}${w.pass ? `・パス${w.pass}` : ''}</span>
      <span class="word-acc ${w.accuracy !== null && w.accuracy < 60 ? 'weak' : ''}">${accStr}</span>
    </li>`;
  }).join('') : `<li class="empty-note">まだ記録がありません。</li>`;

  return `
    <div class="tanzaku">
      <h1 class="title" style="font-size:1.2rem;">マイページ</h1>
      <div class="segmented" id="mypage-tabs" style="margin-bottom:24px;">
        <button type="button" class="seg-btn ${state.mypageTab==='sessions'?'active':''}" data-tab="sessions">セッション履歴</button>
        <button type="button" class="seg-btn ${state.mypageTab==='words'?'active':''}" data-tab="words">熟語別成績</button>
      </div>

      ${state.mypageTab === 'sessions' ? `
        ${buildSparkline(sessions.slice(0,20).reverse())}
        <ul class="record-list">${sessionsHtml}</ul>
      ` : `
        <p class="lead" style="margin-bottom:16px;">正答率が低い熟語から順に表示しています。</p>
        <ul class="record-list">${wordsHtml}</ul>
      `}

      <button id="back-btn" class="ghost-btn" style="width:100%;">プレイ画面に戻る</button>
    </div>
  `;
}

/* ========================================================================
   イベント登録・描画本体
   ======================================================================== */

function attachListeners(){
  if(state.screen === 'error'){
    const rb = document.getElementById('retry-btn');
    if(rb) rb.addEventListener('click', init);
    return;
  }

  if(state.screen === 'start'){
    document.getElementById('dept-select').addEventListener('change', e=>{ state.student.department = e.target.value; saveStudent(); });
    document.getElementById('number-select').addEventListener('change', e=>{ state.student.number = parseInt(e.target.value,10); saveStudent(); });
    document.getElementById('name-input').addEventListener('input', e=>{ state.student.name = e.target.value; });
    document.getElementById('name-input').addEventListener('change', saveStudent);

    document.querySelectorAll('#tier-grid .tier-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.tier = btn.dataset.tier; render(); });
    });
    document.querySelectorAll('#mode-segmented .seg-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.mode = btn.dataset.mode; render(); });
    });
    document.getElementById('num-input').addEventListener('input', (e)=>{
      const v = parseInt(e.target.value, 10);
      if(!isNaN(v)){
        if(state.mode === 'count') state.targetCount = v; else state.timeLimit = v;
      }
    });
    document.getElementById('hint-select').addEventListener('change', e=>{ state.hintMode = e.target.value; });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('mypage-btn-start').addEventListener('click', ()=>{ state.screen = 'mypage'; render(); });

  } else if(state.screen === 'play'){
    const blanks = state.current.blanks;

    if(!state.checked){
      blanks.forEach((idx, pos)=>{
        const inp = document.getElementById('blank-'+idx);
        inp.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter'){
            e.preventDefault();
            if(pos < blanks.length - 1){
              document.getElementById('blank-'+blanks[pos+1]).focus();
            } else {
              checkAnswer();
            }
          }
        });
      });
      const firstInput = document.getElementById('blank-'+blanks[0]);
      if(firstInput) firstInput.focus();
    }

    if(state.hintMode !== 'none'){
      const hb = document.getElementById('hint-btn');
      if(hb) hb.addEventListener('click', ()=>{ state.current.hintShown = true; state.hintUsedCount += 1; render(); });
    }

    document.getElementById('pass-btn').addEventListener('click', ()=>{ if(!state.checked) passQuestion(); });
    document.getElementById('check-btn').addEventListener('click', ()=>{ state.checked ? advance() : checkAnswer(); });

  } else if(state.screen === 'result'){
    document.getElementById('restart-btn').addEventListener('click', restart);
    document.getElementById('mypage-btn-result').addEventListener('click', ()=>{ state.screen = 'mypage'; render(); });

  } else if(state.screen === 'mypage'){
    document.querySelectorAll('#mypage-tabs .seg-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.mypageTab = btn.dataset.tab; render(); });
    });
    document.getElementById('back-btn').addEventListener('click', ()=>{ state.screen = 'start'; render(); });
  }
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'loading') app.innerHTML = renderLoading();
  else if(state.screen === 'error') app.innerHTML = renderError();
  else if(state.screen === 'start') app.innerHTML = renderStart();
  else if(state.screen === 'play') app.innerHTML = renderPlay();
  else if(state.screen === 'mypage') app.innerHTML = renderMypage();
  else app.innerHTML = renderResult();
  attachListeners();
}

async function init(){
  state.screen = 'loading';
  state.loadError = null;
  render();

  loadProgress();
  loadStudent();

  try{
    const res = await fetch(CSV_FILE);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    buildIdioms(text);
    if(ALL_IDIOMS.length === 0) throw new Error('empty dataset');
    state.screen = 'start';
  } catch(err){
    console.error('CSV読み込みエラー', err);
    state.loadError = err;
    state.screen = 'error';
  }
  render();

  flushPendingQueue();
}

// オフラインでも起動できるよう、HTML・CSV・フォントをService Workerでキャッシュする
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js')
      .catch(err=>console.error('Service Workerの登録に失敗しました', err));
  });
}

init();
</script>
